name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: PWA icons / manifest / online-only SW
        run: npm run check:pwa-icons

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

  db-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start Supabase (migrations from zero)
        # La matriz usa Auth + PostgREST; `supabase db start` levanta solo Postgres.
        run: supabase start

      - name: Migration list (local)
        run: supabase migration list --local

      - name: Security advisors (fail on warn+)
        run: supabase db advisors --local --type security --level warn --fail-on warn

      - name: Performance advisors (report only)
        run: supabase db advisors --local --type performance --level info

      - name: Export local API keys (no print secrets)
        id: keys
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "API_URL=${API_URL}"
            echo "ANON_KEY=${ANON_KEY}"
            echo "SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: RLS coverage on public tables
        run: npm run test:db-rls

      - name: Security matrix anon/service
        run: npm run test:db-security
        env:
          STAGE2_SUPABASE_URL: ${{ env.API_URL }}
          STAGE2_ANON_KEY: ${{ env.ANON_KEY }}
          STAGE2_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Control negativo policy anónima (cleanup garantizado)
        run: npm run test:db-insecure-control
        env:
          STAGE2_SUPABASE_URL: ${{ env.API_URL }}
          STAGE2_ANON_KEY: ${{ env.ANON_KEY }}
          ANON_KEY: ${{ env.ANON_KEY }}

      - name: Check generated types drift
        # No regenerar antes: hacerlo convertiría el control en un falso positivo.
        run: npm run db:types:check

      - name: Integration Stage 0 + Stage 1 + Stage 6.1
        run: |
          eval "$(supabase status -o env)"
          export STAGE0_INTEGRATION=1
          export STAGE1_INTEGRATION=1
          export STAGE61_INTEGRATION=1
          export STAGE0_SUPABASE_URL="$API_URL"
          export STAGE0_ANON_KEY="$ANON_KEY"
          export STAGE0_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export STAGE1_SUPABASE_URL="$API_URL"
          export STAGE1_ANON_KEY="$ANON_KEY"
          export STAGE1_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export STAGE61_SUPABASE_URL="$API_URL"
          export STAGE61_ANON_KEY="$ANON_KEY"
          export STAGE61_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          # Usuarios de prueba locales (sin PII real)
          # La suite falla si STAGE1=1 y faltan users; se crean vía Admin API
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js')
          const url = process.env.STAGE0_SUPABASE_URL
          const service = createClient(url, process.env.STAGE0_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          async function ensureUser(email, password) {
            const list = await service.auth.admin.listUsers({ page: 1, perPage: 200 })
            if (list.error) throw list.error
            const existing = (list.data?.users || []).find((u) => u.email === email)
            if (existing) return existing.id
            const created = await service.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
            })
            if (created.error) throw created.error
            return created.data.user.id
          }
          ;(async () => {
            const a = await ensureUser('stage0-a@example.com', 'Stage0-Test-Pass-A1!')
            const b = await ensureUser('stage0-b@example.com', 'Stage0-Test-Pass-B1!')
            await ensureUser('stage61-a@example.com', 'Stage61-Test-Pass-A1!')
            await ensureUser('stage61-b@example.com', 'Stage61-Test-Pass-B1!')
            const bootstrap = await service.rpc('bootstrap_first_admin', { p_user_id: a })
            if (bootstrap.error) throw bootstrap.error
            console.log('users ready')
          })().catch((e) => {
            console.error('user bootstrap failed', e?.message || e)
            process.exit(1)
          })
          NODE
          export STAGE0_USER_A_EMAIL=stage0-a@example.com
          export STAGE0_USER_A_PASSWORD='Stage0-Test-Pass-A1!'
          export STAGE0_USER_B_EMAIL=stage0-b@example.com
          export STAGE0_USER_B_PASSWORD='Stage0-Test-Pass-B1!'
          export STAGE1_USER_A_EMAIL="$STAGE0_USER_A_EMAIL"
          export STAGE1_USER_A_PASSWORD="$STAGE0_USER_A_PASSWORD"
          export STAGE1_USER_B_EMAIL="$STAGE0_USER_B_EMAIL"
          export STAGE1_USER_B_PASSWORD="$STAGE0_USER_B_PASSWORD"
          export STAGE61_USER_A_EMAIL=stage61-a@example.com
          export STAGE61_USER_A_PASSWORD='Stage61-Test-Pass-A1!'
          export STAGE61_USER_B_EMAIL=stage61-b@example.com
          export STAGE61_USER_B_PASSWORD='Stage61-Test-Pass-B1!'
          npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-test-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start Supabase local (E2E mutante aislado)
        run: supabase start

      - name: Export local keys for E2E (masked)
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "API_URL=${API_URL}"
            echo "ANON_KEY=${ANON_KEY}"
            echo "SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "E2E_SUPABASE_URL=${API_URL}"
            echo "E2E_ANON_KEY=${ANON_KEY}"
            echo "E2E_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "E2E_USER_EMAIL=e2e-admin@example.com"
            echo "E2E_USER_PASSWORD=E2E-Test-Pass-A1!"
          } >> "$GITHUB_ENV"

      - name: Bootstrap E2E admin (local only)
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { createClient } = require('@supabase/supabase-js')
          const url = process.env.E2E_SUPABASE_URL
          const service = createClient(url, process.env.E2E_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          ;(async () => {
            const email = process.env.E2E_USER_EMAIL
            const password = process.env.E2E_USER_PASSWORD
            const list = await service.auth.admin.listUsers({ page: 1, perPage: 200 })
            if (list.error) throw list.error
            let user = (list.data?.users || []).find((u) => u.email === email)
            if (!user) {
              const created = await service.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
              })
              if (created.error) throw created.error
              user = created.data.user
            }
            const boot = await service.rpc('bootstrap_first_admin', { p_user_id: user.id })
            if (boot.error) {
              const upsert = await service.from('user_roles').upsert(
                { user_id: user.id, role: 'admin', updated_by: user.id },
                { onConflict: 'user_id' }
              )
              if (upsert.error) {
                console.error('role bootstrap failed')
                process.exit(1)
              }
            }

            // El catálogo se prerenderiza en el build de producción. Sembrar antes
            // del build permite que orders-catalog pruebe esa salida estática.
            const { data: existingCategory, error: categoryReadError } = await service
              .from('categories')
              .select('id')
              .limit(1)
              .maybeSingle()
            if (categoryReadError) throw categoryReadError
            let categoryId = existingCategory?.id
            if (!categoryId) {
              const createdCategory = await service
                .from('categories')
                .insert({ name: 'E2E Cat' })
                .select('id')
                .single()
              if (createdCategory.error) throw createdCategory.error
              categoryId = createdCategory.data.id
            }
            const catalogProductName = `E2E Catalog Order ${Date.now()}`
            const catalogProduct = await service
              .from('products')
              .insert({
                name: catalogProductName,
                category_id: categoryId,
                brand: 'E2E',
                sale_price: 2500,
                purchase_price: 1000,
                stock: 20,
                min_stock: 1,
                visible_in_catalog: true,
                discount_percentage: 0,
              })
              .select('id, name')
              .single()
            if (catalogProduct.error) throw catalogProduct.error
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `E2E_CATALOG_PRODUCT_ID=${catalogProduct.data.id}\n` +
                `E2E_CATALOG_PRODUCT_NAME=${catalogProduct.data.name}\n`
            )
            console.log('e2e admin and prebuild catalog product ready')
          })().catch((e) => {
            console.error(e?.message || e)
            process.exit(1)
          })
          NODE

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      # Siempre instalar Chromium: con cache hit es no-op/rápido; evita binario incompleto.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build app for E2E
        # Webpack evita el fallo intermitente de Turbopack al resolver fuentes
        # de Google en runners efímeros; sigue siendo un build de producción
        # que luego se ejecuta con `next start`.
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E (local Supabase only — webServer arranca next start)
        run: |
          # Fail-closed: sin keys locales no se corre (no skip silencioso).
          test -n "$E2E_SUPABASE_URL"
          test -n "$E2E_ANON_KEY"
          test -n "$E2E_SERVICE_ROLE_KEY"
          # Playwright webServer usa `npm run start` cuando CI=true (no omite servidor).
          npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_TEST: '1'
          PLAYWRIGHT_REUSE: '0'
          # CSP de next start permite loopback solo si NEXT_PUBLIC apunta a local
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          E2E_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          E2E_SERVICE_ROLE_KEY: ${{ env.E2E_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ env.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ env.E2E_USER_PASSWORD }}
          E2E_CATALOG_PRODUCT_ID: ${{ env.E2E_CATALOG_PRODUCT_ID }}
          E2E_CATALOG_PRODUCT_NAME: ${{ env.E2E_CATALOG_PRODUCT_NAME }}

      - name: Postdeploy smoke against local server (read-only, fail-closed)
        run: |
          # Liberar puerto por si el webServer de Playwright no cerró a tiempo
          fuser -k 3000/tcp 2>/dev/null || true
          npm run start &
          SERVER_PID=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/catalogo >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Server did not become ready for smoke"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          npm run test:smoke
          SMOKE_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_EXIT
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
