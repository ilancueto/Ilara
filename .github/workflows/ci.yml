name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ilara-cloud-staging
  cancel-in-progress: false

env:
  SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
  SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
  SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
  SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
  SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Isolated SQL transactions and authorization (no Docker)
        run: npm run test:db-isolated

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: PWA icons / manifest / online-only SW
        run: npm run check:pwa-icons

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

  db-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate cloud staging target
        run: npm run db:check:test-env

      - name: Apply cloud staging migrations and fictitious seed
        run: npm run db:prepare:test

      - name: Deploy staging functions without Docker
        run: supabase functions deploy passkey-auth shipping-quotes --project-ref "$SUPABASE_TEST_PROJECT_REF" --use-api --no-verify-jwt

      - name: Security advisors
        run: npm run db:advisors:security

      - name: Performance advisors
        run: npm run db:advisors

      - name: Export cloud test keys
        run: |
          {
            echo "API_URL=$SUPABASE_TEST_URL"
            echo "ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: RLS coverage on public tables
        run: npm run test:db-rls

      - name: Durable notification outbox on cloud staging (rollback)
        run: node scripts/check-cloud-outbox.mjs

      - name: Security matrix anon/service
        run: npm run test:db-security
        env:
          STAGE2_SUPABASE_URL: ${{ env.API_URL }}
          STAGE2_ANON_KEY: ${{ env.ANON_KEY }}
          STAGE2_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Control negativo policy anónima (cleanup garantizado)
        run: npm run test:db-insecure-control
        env:
          STAGE2_SUPABASE_URL: ${{ env.API_URL }}
          STAGE2_ANON_KEY: ${{ env.ANON_KEY }}
          ANON_KEY: ${{ env.ANON_KEY }}

      - name: Check generated types drift
        # No regenerar antes: hacerlo convertiría el control en un falso positivo.
        run: npm run db:types:check

      - name: Integration Stage 0 + Stage 1 + Stage 6.1–6.6 + Stage 8 + Stage 9
        run: node scripts/run-cloud-tests.mjs integration

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-test-build, db-security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate cloud staging target
        run: npm run db:check:test-env

      - name: Export cloud E2E keys
        run: |
          {
            echo "API_URL=$SUPABASE_TEST_URL"
            echo "ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "E2E_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "E2E_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "E2E_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
            echo "E2E_USER_EMAIL=e2e-admin@example.com"
            echo "E2E_USER_PASSWORD=E2E-Test-Pass-A1!"
            echo "ORDER_ACCESS_SECRET=e2e-order-access-secret-32"
            echo "CRON_SECRET=e2e-cron-secret-32chars"
          } >> "$GITHUB_ENV"

      - name: Bootstrap E2E admin (cloud staging only)
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { createClient } = require('@supabase/supabase-js')
          const url = process.env.E2E_SUPABASE_URL
          const service = createClient(url, process.env.E2E_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          ;(async () => {
            const email = process.env.E2E_USER_EMAIL
            const password = process.env.E2E_USER_PASSWORD
            const list = await service.auth.admin.listUsers({ page: 1, perPage: 200 })
            if (list.error) throw list.error
            let user = (list.data?.users || []).find((u) => u.email === email)
            if (!user) {
              const created = await service.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
              })
              if (created.error) throw created.error
              user = created.data.user
            }
            const boot = await service.rpc('bootstrap_first_admin', { p_user_id: user.id })
            if (boot.error) {
              const upsert = await service.from('user_roles').upsert(
                { user_id: user.id, role: 'admin', updated_by: user.id },
                { onConflict: 'user_id' }
              )
              if (upsert.error) {
                console.error('role bootstrap failed')
                process.exit(1)
              }
            }

            // El catálogo se prerenderiza en el build de producción. Sembrar antes
            // del build permite que orders-catalog pruebe esa salida estática.
            const { data: existingCategory, error: categoryReadError } = await service
              .from('categories')
              .select('id')
              .limit(1)
              .maybeSingle()
            if (categoryReadError) throw categoryReadError
            let categoryId = existingCategory?.id
            if (!categoryId) {
              const createdCategory = await service
                .from('categories')
                .insert({ name: 'E2E Cat' })
                .select('id')
                .single()
              if (createdCategory.error) throw createdCategory.error
              categoryId = createdCategory.data.id
            }
            const catalogProductName = `E2E Catalog Order ${Date.now()}`
            const catalogProduct = await service
              .from('products')
              .insert({
                name: catalogProductName,
                category_id: categoryId,
                brand: 'E2E',
                sale_price: 2500,
                purchase_price: 1000,
                stock: 20,
                min_stock: 1,
                visible_in_catalog: true,
                discount_percentage: 0,
              })
              .select('id, name')
              .single()
            if (catalogProduct.error) throw catalogProduct.error
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `E2E_CATALOG_PRODUCT_ID=${catalogProduct.data.id}\n` +
                `E2E_CATALOG_PRODUCT_NAME=${catalogProduct.data.name}\n`
            )
            console.log('e2e admin and prebuild catalog product ready')
          })().catch((e) => {
            console.error(e?.message || e)
            process.exit(1)
          })
          NODE

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      # Siempre instalar Chromium: con cache hit es no-op/rápido; evita binario incompleto.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build app for E2E
        # Webpack evita el fallo intermitente de Turbopack al resolver fuentes
        # de Google en runners efímeros; sigue siendo un build de producción
        # que luego se ejecuta con `next start`.
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ORDER_ACCESS_SECRET: ${{ env.ORDER_ACCESS_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}

      - name: Run E2E (cloud staging only — webServer arranca next start)
        run: |
          # Fail-closed: sin keys de staging no se corre (no skip silencioso).
          test -n "$E2E_SUPABASE_URL"
          test -n "$E2E_ANON_KEY"
          test -n "$E2E_SERVICE_ROLE_KEY"
          # Playwright webServer usa `npm run start` cuando CI=true (no omite servidor).
          npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_TEST: '1'
          PLAYWRIGHT_REUSE: '0'
          # NEXT_PUBLIC y E2E apuntan al mismo staging en la nube
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          E2E_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          E2E_SERVICE_ROLE_KEY: ${{ env.E2E_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ env.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ env.E2E_USER_PASSWORD }}
          E2E_CATALOG_PRODUCT_ID: ${{ env.E2E_CATALOG_PRODUCT_ID }}
          E2E_CATALOG_PRODUCT_NAME: ${{ env.E2E_CATALOG_PRODUCT_NAME }}
          ORDER_ACCESS_SECRET: ${{ env.ORDER_ACCESS_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SERVICE_ROLE_KEY }}

      - name: Postdeploy smoke against local server (read-only, fail-closed)
        run: |
          # Liberar puerto por si el webServer de Playwright no cerró a tiempo
          fuser -k 3000/tcp 2>/dev/null || true
          npm run start &
          SERVER_PID=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/catalogo >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Server did not become ready for smoke"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          npm run test:smoke
          SMOKE_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_EXIT
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
