name: Ilara operations monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ilara-operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public availability and notification health
        id: probe
        continue-on-error: true
        env:
          ILARA_CRON_SECRET: ${{ secrets.ILARA_CRON_SECRET }}
        run: |
          test -n "$ILARA_CRON_SECRET"
          status=$(curl --fail --silent --show-error --max-time 30 https://ilara.com.ar/catalogo --output /dev/null --write-out '%{http_code}')
          test "$status" = '200'
          status=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $ILARA_CRON_SECRET" \
            https://ilara.com.ar/api/internal/operations-health --output "$RUNNER_TEMP/ilara-health.json" --write-out '%{http_code}')
          test "$status" = '200'
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).ok!==true)process.exit(1)" "$RUNNER_TEMP/ilara-health.json"

      - name: Open or resolve an operational incident
        uses: actions/github-script@v7
        env:
          PROBE_RESULT: ${{ steps.probe.outcome }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = '[Operación Ilara] Revisar disponibilidad o notificaciones';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const incident = issues.find(issue => !issue.pull_request && issue.title === title && issue.user?.login === 'github-actions[bot]');
            if (process.env.PROBE_RESULT !== 'success') {
              if (!incident) await github.rest.issues.create({owner, repo, title,
                body: `El monitor detectó un fallo de disponibilidad, configuración de email o cola de avisos. Revisar el [run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). No incluye datos de clientes.`});
              core.setFailed('Operational probe failed');
            } else if (incident) {
              await github.rest.issues.update({owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed'});
            }
