version: 2
updates:
  # Dependencias npm: un solo PR semanal con parches y menores agrupados.
  # Los saltos mayores se revisan a mano (React, TypeScript, ESLint, Vitest, tipos de Node).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Versiones de las acciones usadas por los workflows de CI y monitores.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
