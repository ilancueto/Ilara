;align-items:center;gap:22px}.edit strong{font-size:21px;line-height:1.15;font-weight:550}.edit span{font-size:12px;display:block;margin-top:6px}.edit .dot{width:56px;height:56px;background:#a42447;border-radius:50%;color:white;display:grid;place-items:center;font-size:25px;flex-shrink:0}.toolbar{display:flex;align-items:center;gap:12px;margin:20px 0}.toolbar h2{margin:0 auto 0 0}.toolbar select{background:none;border:1px solid #ded8d2;padding:12px;border-radius:8px;max-width:180px}.filters{border:1px solid #ded8d2;border-radius:8px;min-height:46px;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 22px}.photo{display:block;position:relative;background:#f4f2ee;border-radius:12px;overflow:hidden;width:100%;aspect-ratio:1/1.1;padding:0}.photo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.tag{position:absolute;top:12px;left:12px;background:#fffefa;padding:6px 9px;border-radius:4px;font-size:11px;font-weight:600}.card .brand{font-size:11px;letter-spacing:1px;color:#68615c;margin-top:15px;text-transform:uppercase}.card h3{min-height:42px;line-height:1.3}.price{font-size:20px;font-weight:550;margin:9px 0 3px}.transfer{color:#78574f;font-size:12px}.card .add{width:100%;margin-top:14px;border:1px solid #d6d0ca;border-radius:7px;min-height:44px;background:transparent;font-size:14px}.card .add:hover{border-color:#a42447;color:#a42447;background:#f9edef}.foot{margin-top:65px;border-top:1px solid #e9e5e1;padding:28px 0;display:flex;justify-content:space-between;font-size:13px;color:#68615c}.foot a{margin-left:20px}.demo{padding:10px 18px;background:#242222;color:#fff;font:12px Arial,sans-serif;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.demo select{font-size:12px;padding:5px;background:#fff;color:#242222;border:0;border-radius:4px}.demo span{margin-right:auto}.crumb{font-size:13px;color:#68615c;margin:24px 0}.pdp{display:grid;grid-template-columns:1.2fr 1fr;gap:65px}.pdp .photo{aspect-ratio:1.1/1;max-height:590px}.pdp h1{font-size:38px;line-height:1.15}.pdp .price{font-size:30px}.pdp .transfer{font-size:15px;margin:8px 0 26px}.pdp .btn{width:100%;margin-bottom:13px}.line{border-top:1px solid #e9e5e1;padding:20px 0}.line p{font-size:14px;margin:8px 0}.quantity{display:flex;border:1px solid #d6d0ca;border-radius:8px;width:130px;justify-content:space-between;align-items:center;margin:20px 0}.quantity button{width:44px;height:44px}.checkout{max-width:1050px;display:grid;grid-template-columns:1.4fr 1fr;gap:50px;margin:34px auto}.checkout h1{font-size:34px}.box{border:1px solid #e9e5e1;padding:26px;border-radius:12px;background:white}.box h2{font-size:20px;margin:0 0 22px}.field{display:block;font-size:13px;margin-bottom:18px}.field input{display:block;border:1px solid #d6d0ca;border-radius:7px;height:48px;padding:12px;width:100%;margin-top:7px;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:15px 0}.choice{display:flex;align-items:center;gap:10px;border:1px solid #d6d0ca;border-radius:8px;padding:16px;margin:10px 0;font-size:14px}.choice:has(input:checked){border-color:#a42447;background:#fff5f6}.steps{font-size:13px;color:#68615c;margin-bottom:25px}.steps b{color:#a42447}.side{align-self:start;position:sticky;top:20px}.mini{width:70px;height:78px;object-fit:contain;background:#f4f2ee;border-radius:8px}.empty{text-align:center;padding:70px 20px}.empty h1{font-size:34px}.status{border-radius:99px;background:#f6e6e8;color:#8b1f3d;padding:7px 12px;font-size:12px}.timeline{border-left:2px solid #e9e5e1;padding-left:20px;margin-left:6px}.timeline p{margin:24px 0}.timeline strong{font-weight:550}.notice{background:#f4f2ee;padding:15px;border-radius:8px;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#242222;color:white;border-radius:10px;padding:16px 22px;z-index:10;min-width:280px;text-align:center}.toast button{color:white;text-decoration:underline;margin-left:14px}.toast[hidden]{display:none}.coupon{margin:22px 0;font-size:14px}.coupon input{border:1px solid #ded8d2;padding:10px;width:65%;margin-top:12px}.center{max-width:760px;margin:38px auto}.wide{width:100%}dialog{border:0;border-radius:14px;padding:28px;width:min(420px,92vw);color:#242222}dialog::backdrop{background:#24222260}dialog label{display:block;margin:20px 0}dialog input{padding:10px;border:1px solid #ded8d2;width:100%;margin-top:8px}body.mobile .wrap{max-width:440px}body.mobile main{max-width:440px;margin:auto}body.mobile .head{gap:14px;flex-wrap:wrap;padding-top:16px;padding-bottom:14px}body.mobile .search{order:3;max-width:none;flex-basis:100%}body.mobile .intro{display:block}body.mobile h1{font-size:34px}body.mobile .edit{display:none}body.mobile .grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}body.mobile .subnav{overflow:auto;gap:22px;white-space:nowrap}body.mobile .pdp,body.mobile .checkout{grid-template-columns:1fr;gap:24px}body.mobile .foot{display:block}body.mobile .toolbar{flex-wrap:wrap}body.mobile .toolbar h2{width:100%;font-size:23px}body.mobile .box{padding:20px}body.mobile .side{position:static}body.mobile .crumb{margin-top:18px}body.mobile .pdp .photo{aspect-ratio:1}body.mobile .pdp h1{font-size:30px}body.mobile .card h3{font-size:14px;min-height:54px}body.mobile .price{font-size:19px}body.mobile .wrap{padding:0 18px}
@media(max-width:650px){.wrap{padding:0 18px}.head{gap:14px;flex-wrap:wrap;padding-top:16px;padding-bottom:14px}.search{order:3;max-width:none;flex-basis:100%}.intro{display:block;margin:23px 0;padding-bottom:22px}h1{font-size:34px}.edit{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}.subnav{overflow:auto;gap:22px;white-space:nowrap}.pdp,.checkout{grid-template-columns:1fr;gap:24px}.foot{display:block}.toolbar{flex-wrap:wrap}.toolbar h2{width:100%;font-size:23px}.box{padding:20px}.side{position:static}.pdp .photo{aspect-ratio:1}.pdp h1{font-size:30px}.card h3{font-size:14px;min-height:54px}.price{font-size:19px}.demo span{width:100%}}
</style>
<div class="demo"><span>PROPUESTA ILARA · Datos ilustrativos · Sin pedidos ni pagos reales</span><label>Pantalla <select id="screen"><option value="catalog">Catálogo</option><option value="product">Producto</option><option value="cart">Bolsa</option><option value="checkout">Checkout</option><option value="payment">Pago</option><option value="tracking">Seguimiento</option><option value="empty">Sin resultados</option></select></label><button style="color:white;text-decoration:underline" id="mobile">Alternar móvil</button></div>
<header><div class="wrap"><div class="head"><a href="#catalog" class="logo" aria-label="Ilara, inicio">ilara<i>.</i></a><label class="search"><input id="search" type="search" placeholder="Buscá un producto o una marca" aria-label="Buscar productos"></label><button class="bag" onclick="go('cart')">Bolsa <b id="count">0</b> ↗</button></div><nav class="subnav" aria-label="Categorías"><button class="active" onclick="category('Todo',this)">Todo</button><button onclick="category('Maquillaje',this)">Maquillaje</button><button onclick="category('Skincare',this)">Skincare</button><button onclick="category('Accesorios',this)">Accesorios</button></nav></div></header>
<main class="wrap" id="main"></main><footer class="wrap"><div class="foot"><div><strong>ilara.</strong> Belleza a tu manera.</div><div><a href="#tracking">Seguir mi pedido</a><a href="#catalog">Volver al catálogo</a></div></div></footer><div id="toast" class="toast" role="status" hidden></div>
<dialog id="filters"><form method="dialog"><div class="row"><h2>Filtrar productos</h2><button aria-label="Cerrar filtros">✕</button></div><label>Precio máximo<input type="number" id="max" min="0" placeholder="Sin límite"></label><button class="btn wide" onclick="applyFilter()">Ver resultados</button></form></dialog>
<script>
const base='https://qbbnvdmadgomfmrsfxlo.supabase.co/storage/v1/object/public/productos/';
const products=[['Kit Lip Oil + Bálsamo hidratante frutal','Tejar',6500,'0.13257283332325542.jpeg','Maquillaje'],['Toalla desmaquillante San Rio','Accesorios',2000,'0.19918185542504474.jpeg','Accesorios'],['Fijador en spray','Maquillaje',10000,'0.5897152728738347.jpeg','Maquillaje'],['Polvo compacto nude','Maquillaje',9000,'0.2357210030295862.jpeg','Maquillaje'],['Esponja para polvo compacto','Accesorios',3000,'0.8281348038980144.jpeg','Accesorios'],['Parche para ojos','Skincare',2500,'0.6661934155664612.jpeg','Skincare']];
let selected=0,bag=[],cat='Todo',query='',max=Infinity,sort='default',timer;const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);const subtotal=()=>bag.reduce((s,x)=>s+products[x.id][2]*x.qty,0);const count=()=>bag.reduce((s,x)=>s+x.qty,0);const photo=(id,tag=false)=>`<img src="${base+products[id][3]}" alt="${products[id][0]}" loading="lazy">${tag?'<span class="tag">ILARA PICKS · DEMO</span>':''}`;
function go(s){location.hash=s;if(location.hash.slice(1)===s)render(s);window.scrollTo(0,0)}function notify(s){const t=document.getElementById('toast');t.innerHTML=s;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,4000)}function add(id){const x=bag.find(x=>x.id===id);if(x)x.qty++;else bag.push({id,qty:1});document.getElementById('count').textContent=count();notify('Agregado a tu bolsa <button onclick="go(\'cart\')">Ver bolsa</button>')}
function update(id,d){const x=bag.find(x=>x.id===id);if(x)x.qty+=d;bag=bag.filter(x=>x.qty>0);render('cart')}function detail(id){selected=id;go('product')}function category(c,button){cat=c;document.querySelectorAll('.subnav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');go('catalog')}function applyFilter(){max=Number(document.getElementById('max').value)||Infinity;render('catalog')}
function cards(){let ids=products.map((_,i)=>i).filter(i=>(cat==='Todo'||products[i][4]===cat)&&products[i][0].toLowerCase().includes(query.toLowerCase())&&products[i][2]<=max);if(sort==='low')ids.sort((a,b)=>products[a][2]-products[b][2]);if(sort==='high')ids.sort((a,b)=>products[b][2]-products[a][2]);return ids.length?ids.map(i=>`<article class="card"><button class="photo" onclick="detail(${i})" aria-label="Ver ${products[i][0]}">${photo(i,i===0)}</button><div class="brand">${products[i][1]}</div><h3><button style="text-align:left;padding:0" onclick="detail(${i})">${products[i][0]}</button></h3><div class="price">${money(products[i][2])}</div><div class="transfer">${money(products[i][2]*.9)} por transferencia</div><button class="add" onclick="add(${i})">Agregar a la bolsa ＋</button></article>`).join(''):'<div class="empty"><h2>No encontramos productos</h2><p>Probá otra búsqueda o quitá los filtros.</p><button class="btn secondary" onclick="reset()">Limpiar filtros</button></div>'}
function reset(){query='';cat='Todo';max=Infinity;document.getElementById('search').value='';go('catalog')}
function summary(){return `<h2>Tu pedido</h2>${bag.map(x=>`<div class="row"><img class="mini" src="${base+products[x.id][3]}" alt=""><div style="flex:1;font-size:14px">${products[x.id][0]}<div class="small">Cantidad: ${x.qty}</div></div><strong>${money(products[x.id][2]*x.qty)}</strong></div>`).join('')}<div class="line"><div class="row"><span>Productos</span><span>${money(subtotal())}</span></div><div class="row small"><span>Entrega</span><span>A elegir</span></div><div class="row"><strong>Subtotal</strong><strong>${money(subtotal())}</strong></div><p class="small">El total final se muestra después de elegir entrega y forma de pago.</p></div>`}
function render(s='catalog'){document.getElementById('screen').value=s;document.getElementById('count').textContent=count();const p=products[selected];let html='';if(s==='catalog')html=`<section class="intro"><div><div class="eyebrow">Tu próxima obsesión, acá.</div><h1>Un poco de color.<br>Mucho de vos.</h1><p>Maquillaje, skincare y esos pequeños favoritos.</p></div><div class="edit"><div class="dot">↗</div><div><strong>Elegí algo<br>que te encante.</strong><span>Explorá el catálogo de Ilara.</span></div></section><div class="toolbar"><h2>${query?'Resultados de búsqueda':cat==='Todo'?'Explorá el catálogo':cat}</h2><button class="filters" onclick="document.getElementById('filters').showModal()">☷ Filtros${max<Infinity?' · 1':''}</button><select aria-label="Ordenar productos" onchange="sort=this.value;render('catalog')"><option value="default" ${sort==='default'?'selected':''}>Recomendados · demo</option><option value="low" ${sort==='low'?'selected':''}>Menor precio</option><option value="high" ${sort==='high'?'selected':''}>Mayor precio</option></select></div><div class="grid">${cards()}</div>`;
if(s==='product')html=`<div class="crumb"><a href="#catalog">Catálogo</a> / ${p[4]}</div><div class="pdp"><div class="photo">${photo(selected)}</div><section><div class="eyebrow">${p[1]}</div><h1>${p[0]}</h1><div class="price">${money(p[2])}</div><div class="transfer">${money(p[2]*.9)} por transferencia</div><p class="small">Disponible · estado ilustrativo</p><button class="btn" onclick="add(${selected})">Agregar a la bolsa · ${money(p[2])} ＋</button><button class="btn secondary" onclick="notify('En la tienda, abre el asesoramiento por WhatsApp.')">Consultar por WhatsApp</button><div class="line"><strong>Entrega y retiro</strong><p>Elegí retiro o consultá el costo de envío al completar tu pedido.</p></div><div class="line"><strong>Sobre este producto</strong><p class="small">Acá se muestra únicamente la descripción pública disponible. La propuesta no inventa ingredientes, beneficios ni variantes.</p></div></section></div>`;
if(s==='empty')html='<section class="empty"><div class="eyebrow">Podemos probar de nuevo</div><h1>No encontramos ese producto</h1><p>Buscá por nombre o explorá todas las categorías.</p><button class="btn" onclick="reset()">Ver todos los productos</button></section>';
if(s==='cart')html=bag.length?`<div class="crumb"><a href="#catalog">← Seguir mirando</a></div><h1 style="font-size:36px">Tu bolsa <span class="small">${count()} productos</span></h1><div class="checkout"><section>${bag.map(x=>`<div class="row line"><img class="mini" src="${base+products[x.id][3]}" alt=""><div style="flex:1"><h3>${products[x.id][0]}</h3><div class="small">${money(products[x.id][2])} por unidad</div><div class="quantity"><button aria-label="Reducir cantidad" onclick="update(${x.id},-1)">−</button><span>${x.qty}</span><button aria-label="Aumentar cantidad" onclick="update(${x.id},1)">＋</button></div></div><strong>${money(products[x.id][2]*x.qty)}</strong></div>`).join('')}<details class="coupon"><summary>¿Tenés un cupón?</summary><input aria-label="Código de cupón" placeholder="Ingresá tu código"><button onclick="notify('Cupón de demostración: no se aplica un descuento real.')">Aplicar</button></details></section><aside class="box side">${summary()}<button class="btn wide" onclick="go('checkout')">Continuar con mi pedido →</button></aside></div>`:'<section class="empty"><h1>Tu bolsa está esperando</h1><p>Elegí algo que te guste y lo guardamos acá.</p><button class="btn" onclick="go(\'catalog\')">Explorar productos</button></section>';
if(s==='checkout')html=`<div class="checkout"><section><a class="small" href="#cart">← Volver a la bolsa</a><h1>Completemos tu pedido</h1><div class="steps"><b>1. Datos y entrega</b> &nbsp; → &nbsp; 2. Pago</div><form onsubmit="event.preventDefault();go('payment')"><div class="box"><h2>Tus datos</h2><label class="field">Nombre y apellido<input required autocomplete="name" placeholder="Como querés que te llamemos"></label><label class="field">Teléfono / WhatsApp<input required type="tel" autocomplete="tel" placeholder="Código de área y número"></label><label class="field">Email · opcional<input type="email" autocomplete="email" placeholder="Para recibir el seguimiento"></label></div><h2>¿Cómo lo recibís?</h2><label class="choice"><input name="delivery" type="radio" checked>Retiro · coordinamos por WhatsApp</label><label class="choice"><input name="delivery" type="radio" onchange="notify('En la implementación: dirección, cotización y selección de envío actuales.')">Envío a domicilio · calcular al elegir dirección</label><label class="choice"><input name="delivery" type="radio">A coordinar</label><p class="notice">Este prototipo no crea pedidos. Usá datos ficticios para recorrerlo.</p><button class="btn wide" type="submit">Continuar al pago →</button></form></section><aside class="box side">${summary()}</aside></div>`;
if(s==='payment')html=`<div class="center"><div class="steps">1. Datos y entrega &nbsp; → &nbsp; <b>2. Pago</b></div><h1 style="font-size:36px">Elegí cómo pagar</h1><p>Pedido de ejemplo · IL-DEMO</p><div class="box"><label class="choice"><input name="pay" type="radio" checked>Transferencia bancaria</label><label class="choice"><input name="pay" type="radio">Mercado Pago</label><p class="small">Los importes por método vienen del servidor. En esta vista sólo se muestra la composición visual.</p><div class="row"><strong>Productos · referencia</strong><strong>${money(subtotal())}</strong></div><button class="btn wide" onclick="notify('Simulación: no se inicia ni se confirma ningún pago.');go('tracking')">Ver seguimiento de ejemplo →</button></div></div>`;
if(s==='tracking')html=`<div class="center"><span class="status">Recibido · ejemplo</span><h1 style="font-size:36px">Tu pedido, en un solo lugar.</h1><p class="small">IL-DEMO · Estado ilustrativo, no es un pedido real</p><div class="box"><h2>Recibimos tu pedido</h2><p>Desde acá podés consultar el pago y seguir los próximos pasos.</p><div class="timeline"><p><strong>● Pedido recibido</strong><br><span class="small">El siguiente paso depende del pago y la confirmación.</span></p><p class="small">Preparación</p><p class="small">Listo para entregar</p></div><button class="btn secondary" onclick="go('payment')">Ver opciones de pago</button></div></div>`;
document.getElementById('main').innerHTML=html;}
document.getElementById('screen').onchange=e=>go(e.target.value);document.getElementById('mobile').onclick=()=>document.body.classList.toggle('mobile');document.getElementById('search').oninput=e=>{query=e.target.value;render('catalog')};window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'catalog'));render(location.hash.slice(1)||'catalog');
</script></html>
